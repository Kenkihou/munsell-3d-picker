name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. サーバー上にNode.js環境を用意
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 2. three.jsやmunsellなどの外部ライブラリをサーバーへ高速インストール
      - name: Install dependencies
        run: npm ci

      # 3. ブラウザで動くように1つの完成品ファイルへ全自動ビルド（翻訳）
      - name: Build
        run: npm run build

      # 4. ビルドされて完成した「dist」フォルダをアップロード対象にする
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 5. WEB上に完全公開
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4